name: Update Sheet Image (Screenshot)

on:
  schedule:
    - cron: '0 * * * *' # 매시간 실행
  workflow_dispatch: # 수동 실행

# 쓰기 권한을 명시적으로 부여합니다
permissions:
  contents: write

jobs:
  capture-image:
    runs-on: ubuntu-latest
    steps:
      # 최신 버전(@v4, @v5)으로 업데이트하여 Node.js 경고 해결
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-nanum
          
      - name: Install Python Libraries
        run: pip install -r requirements.txt

      - name: Run Capture Script
        run: python render.py

      - name: Push Image to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git add output.png
          # 변경사항이 있을 때만 커밋, 없으면 종료
          git commit -m "Auto-update visual image: $(date)" || exit 0
          git push
