<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로스트 소드 공략 - 월요일</title>
    
    <meta property="og:title" content="로스트 소드 공략 - 월요일">
    <meta property="og:description" content="가온누리 월요일 최신 공략표 (자동 업데이트)">
    <meta property="og:image" content="https://ferencebw.github.io/lostsword_gaonnuri/mon.png">
    <meta property="og:url" content="https://ferencebw.github.io/lostsword_gaonnuri/mon.html">
    <meta property="og:type" content="website">
    
    <style>
        /* [설명] 모바일 최적화 스타일 */
        body {
            margin: 0; 
            padding: 0;
            /* [해결 1] 배경색을 흰색으로 변경하여 여백을 숨깁니다. */
            background: white; 
            
            /* [해결 2] 중앙 정렬을 제거하고, 이미지를 상단에 배치합니다. */
            display: block; 
            text-align: center; /* 이미지를 가로 중앙에 배치 */
            width: 100%;
            height: 100%;
        }
        
        img {
            /* [해결 3] 이미지 너비를 모바일 화면에 꽉 채웁니다. */
            width: 100vw; 
            max-width: 1000px; /* 데스크탑에서 너무 커지는 것을 방지 */
            height: auto;
            
            /* 불필요한 테두리 및 여백 제거 */
            border: none;
            display: inline-block;
            vertical-align: top; /* 이미지를 상단에 밀착 */
        }
    </style>
</head>
<body>
    <img src="mon.png" alt="월요일 공략">
</body>
</html>
